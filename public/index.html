<!DOCTYPE html>
<html>
<head>
  <title>Chat App</title>
  <style>
    body { font-family: sans-serif; }
    #messages { border: 1px solid #aaa; height: 300px; overflow-y: auto; padding: 5px; }
    #users { border: 1px solid #aaa; height: 300px; overflow-y: auto; padding: 5px; }
  </style>
</head>
<body>

<h2>Chat</h2>

<div>
  <label>Your name:</label>
  <input id="nameInput" type="text">
  <button id="setNameBtn">Set</button>
</div>

<div style="display:flex; gap:20px; margin-top:15px;">
  <div style="flex: 2;">
    <div id="messages"></div>

    <input id="msgInput" type="text" placeholder="Message">
    <button id="sendBtn">Send</button>
  </div>

  <div style="flex:1;">
    <h3>Users</h3>
    <ul id="userList"></ul>
  </div>
</div>

<!-- ADMIN LOGIN -->
<div id="admin-login" style="display:none; margin-top:20px;">
  <h3>Admin Login</h3>
  <input id="admin-pass" type="password" placeholder="Admin Password">
  <button id="admin-login-btn">Login</button>
</div>

<!-- ADMIN CONSOLE -->
<div id="admin-console" style="display:none; margin-top:20px;">
  <h3>Admin Console</h3>
  <button id="clear-chat">Clear Chat</button>
  <h4>Users</h4>
  <ul id="admin-user-list"></ul>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="chat.js"></script>

</body>
</html>
